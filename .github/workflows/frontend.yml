name: Frontend verification
on:
  push:
    paths: ['street-smart-frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['street-smart-frontend/**', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: street-smart-frontend/package-lock.json
      - run: npm ci
        working-directory: street-smart-frontend
      - run: npm run build
        working-directory: street-smart-frontend
      - run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: street-smart-frontend
