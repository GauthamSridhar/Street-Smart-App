spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: street-smart
    ttl: PT1H
  internal-key: ${INTERNAL_API_KEY}
  sessions:
    url: ${SESSION_VALIDATION_URL:}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    env:
      access: none
    configprops:
      access: none
    health:
      probes:
        enabled: true
      show-details: when_authorized
server:
  error:
    include-message: never
    include-stacktrace: never
logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
