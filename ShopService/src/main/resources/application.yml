server:
  port: ${PORT:8083}
spring:
  config:
    import: classpath:backend-defaults.yml
  application:
    name: ShopService
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shops}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
