<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
<title id="title">Street Smart / Recoverable shop approvals</title><desc id="desc">Persisted state and delivery markers support retryable HTTP delivery between Shop Service and Approval Service. Revisions prevent delayed decisions from overwriting resubmission.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a87009"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#20262b}.title{font-size:44px;font-weight:700}.sub{font-size:23px;fill:#596777}.label{font-size:25px;font-weight:700}.body{font-size:20px;fill:#596777}.note{font-size:18px;fill:#596777}.box{fill:#fff;stroke:#d9d2c5;stroke-width:2}.arrow{fill:none;stroke:#a87009;stroke-width:3;marker-end:url(#arrow)} .label{font-size:22px}.body{font-size:18px}</style></defs>
<rect width="1600" height="800" rx="24" fill="#f7f3ea"/>
<rect x="60" y="48" width="8" height="90" rx="4" fill="#eaa30d"/>
<text x="88" y="88" class="title">Street Smart / Recoverable shop approvals</text><text x="88" y="125" class="sub">At-least-once delivery · eventual consistency · revision-aware application state</text><rect x="60" y="240" width="260" height="150" rx="16" class="box"/><text x="82" y="280" class="label">01 / Save shop</text><text x="82" y="312" class="body">PENDING, revision 0</text><text x="82" y="339" class="body">Persist delivery marker</text><path d="M320 315 H360" class="arrow"/><rect x="365" y="240" width="260" height="150" rx="16" class="box"/><text x="387" y="280" class="label">02 / Deliver request</text><text x="387" y="312" class="body">Shop worker retries</text><text x="387" y="339" class="body">Approval accepts revision</text><path d="M625 315 H665" class="arrow"/><rect x="670" y="240" width="260" height="150" rx="16" class="box"/><text x="692" y="280" class="label">03 / Admin decision</text><text x="692" y="312" class="body">Approve or reject</text><text x="692" y="339" class="body">Save history + pending</text><path d="M930 315 H970" class="arrow"/><rect x="975" y="240" width="260" height="150" rx="16" class="box"/><text x="997" y="280" class="label">04 / Deliver decision</text><text x="997" y="312" class="body">Approval worker retries</text><text x="997" y="339" class="body">HTTP to Shop Service</text><path d="M1235 315 H1275" class="arrow"/><rect x="1280" y="240" width="260" height="150" rx="16" class="box" style="fill:#fff3d5;stroke:#eaa30d"/><text x="1302" y="280" class="label">05 / Apply safely</text><text x="1302" y="312" class="body">Check revision</text><text x="1302" y="339" class="body">Reject stale decisions</text><rect x="60" y="450" width="710" height="138" rx="16" class="box"/><text x="82" y="490" class="label">Temporary dependency failure</text><text x="82" y="522" class="body">Delivery marker stays persisted; a later worker iteration retries.</text><text x="82" y="549" class="body">Duplicate delivery must not repeat the domain transition.</text><rect x="810" y="450" width="730" height="138" rx="16" class="box"/><text x="832" y="490" class="label">Rejection → correction → resubmission</text><text x="832" y="522" class="body">New revision identifies the new application.</text><text x="832" y="549" class="body">A delayed decision for an older revision cannot overwrite it.</text><text x="60" y="650" class="body">Decision worker: up to 50 unsynchronised records per iteration; default fixed delay 5 seconds.</text><text x="60" y="692" class="body">No distributed transaction, message broker or exactly-once processing claim.</text><text x="60" y="744" class="note">Source: ShopService delivery workflow + ShopApprovalService decision worker and revision checks.</text></svg>
