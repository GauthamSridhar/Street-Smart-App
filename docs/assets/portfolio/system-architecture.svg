<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Street Smart / System architecture</title><desc id="desc">Angular and Caddy route API requests through Spring Cloud Gateway to five domain services. Each domain owns a database within one PostgreSQL instance.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a87009"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#20262b}.title{font-size:44px;font-weight:700}.sub{font-size:23px;fill:#596777}.label{font-size:25px;font-weight:700}.body{font-size:20px;fill:#596777}.note{font-size:18px;fill:#596777}.box{fill:#fff;stroke:#d9d2c5;stroke-width:2}.arrow{fill:none;stroke:#a87009;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="900" rx="24" fill="#f7f3ea"/>
<rect x="60" y="48" width="8" height="90" rx="4" fill="#eaa30d"/>
<text x="88" y="88" class="title">Street Smart / System architecture</text><text x="88" y="125" class="sub">Five business domains · one local PostgreSQL instance · Docker Compose</text><rect x="60" y="178" width="280" height="128" rx="16" class="box"/><text x="82" y="218" class="label">Angular 21</text><text x="82" y="250" class="body">Customer · Shopkeeper</text><text x="82" y="277" class="body">Administrator</text><rect x="400" y="178" width="320" height="128" rx="16" class="box"/><text x="422" y="218" class="label">Caddy web proxy</text><text x="422" y="250" class="body">Static application files</text><text x="422" y="277" class="body">/api → gateway</text><rect x="780" y="178" width="345" height="128" rx="16" class="box" style="fill:#fff3d5;stroke:#eaa30d"/><text x="802" y="218" class="label">API Gateway</text><text x="802" y="250" class="body">JWT checks · CORS</text><text x="802" y="277" class="body">Routes to domain services</text><path d="M340 242H395 M720 242H775" class="arrow"/><rect x="1185" y="178" width="355" height="128" rx="16" class="box"/><text x="1207" y="218" class="label">Eureka</text><text x="1207" y="250" class="body">Service registration</text><text x="1207" y="277" class="body">Discovery, not API traffic</text><path d="M1125 208H1180" stroke="#8b98a4" stroke-width="2" stroke-dasharray="7 6"/><rect x="40" y="356" width="1520" height="442" rx="22" fill="none" stroke="#c9c0ad" stroke-width="2" stroke-dasharray="8 6"/><text x="60" y="388" class="note">PRIVATE APPLICATION NETWORK / LOGICAL DATABASE OWNERSHIP</text><rect x="60" y="430" width="260" height="140" rx="16" class="box"/><text x="82" y="470" class="label">User Service</text><text x="82" y="502" class="body">Accounts · OTP</text><text x="82" y="529" class="body">Sessions</text><path d="M190 570 V648" class="arrow"/><rect x="60" y="654" width="260" height="95" rx="16" class="box"/><text x="82" y="694" class="label">users DB</text><text x="82" y="726" class="body">Domain-owned database</text><path d="M190 402 V425" class="arrow"/><rect x="365" y="430" width="260" height="140" rx="16" class="box"/><text x="387" y="470" class="label">Shop Service</text><text x="387" y="502" class="body">Products · Images</text><text x="387" y="529" class="body">Shop search</text><path d="M495 570 V648" class="arrow"/><rect x="365" y="654" width="260" height="95" rx="16" class="box"/><text x="387" y="694" class="label">shops DB</text><text x="387" y="726" class="body">Domain-owned database</text><path d="M495 402 V425" class="arrow"/><rect x="670" y="430" width="260" height="140" rx="16" class="box"/><text x="692" y="470" class="label">Approval Service</text><text x="692" y="502" class="body">Decisions · History</text><text x="692" y="529" class="body">Retry delivery</text><path d="M800 570 V648" class="arrow"/><rect x="670" y="654" width="260" height="95" rx="16" class="box"/><text x="692" y="694" class="label">approvals DB</text><text x="692" y="726" class="body">Domain-owned database</text><path d="M800 402 V425" class="arrow"/><rect x="975" y="430" width="260" height="140" rx="16" class="box"/><text x="997" y="470" class="label">Rating Service</text><text x="997" y="502" class="body">Reviews · Reports</text><text x="997" y="529" class="body">Moderation</text><path d="M1105 570 V648" class="arrow"/><rect x="975" y="654" width="260" height="95" rx="16" class="box"/><text x="997" y="694" class="label">ratings DB</text><text x="997" y="726" class="body">Domain-owned database</text><path d="M1105 402 V425" class="arrow"/><rect x="1280" y="430" width="260" height="140" rx="16" class="box"/><text x="1302" y="470" class="label">Favorite Service</text><text x="1302" y="502" class="body">Shop favourites</text><text x="1302" y="529" class="body">Idempotent writes</text><path d="M1410 570 V648" class="arrow"/><rect x="1280" y="654" width="260" height="95" rx="16" class="box"/><text x="1302" y="694" class="label">favorites DB</text><text x="1302" y="726" class="body">Domain-owned database</text><path d="M1410 402 V425" class="arrow"/><path d="M953 306V402H190 M190 402H1410" fill="none" stroke="#a87009" stroke-width="3"/><text x="60" y="837" class="body">backend-common is a shared library, not a running service. PostgreSQL hosts all five databases locally.</text><text x="60" y="870" class="note">Logical view; HTTP dependencies and external Maps/Twilio integrations are described in the case study. No HA or cloud deployment claim.</text></svg>
