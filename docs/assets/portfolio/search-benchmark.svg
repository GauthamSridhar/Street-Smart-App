<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
<title id="title">Street Smart / Seeded local search baseline</title><desc id="desc">Five local search workloads, each with 200 measured requests at four workers. All 1000 requests succeeded. p95 latency ranges from 15.02 to 21.67 milliseconds.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a87009"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#20262b}.title{font-size:44px;font-weight:700}.sub{font-size:23px;fill:#596777}.label{font-size:25px;font-weight:700}.body{font-size:20px;fill:#596777}.note{font-size:18px;fill:#596777}.box{fill:#fff;stroke:#d9d2c5;stroke-width:2}.arrow{fill:none;stroke:#a87009;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1600" height="850" rx="24" fill="#f7f3ea"/>
<rect x="60" y="48" width="8" height="90" rx="4" fill="#eaa30d"/>
<text x="88" y="88" class="title">Street Smart / Seeded local search baseline</text><text x="88" y="125" class="sub">5 October 2026 · 1,203 catalogue products · 1,000 measured requests · zero failures</text><rect x="60" y="175" width="1480" height="95" rx="16" class="box"/><text x="82" y="215" class="label">Scope: short warm local run</text><text x="82" y="247" class="body">4 workers · 10 warm-ups + 200 requests per workload · first page, 20 results</text><text x="60" y="317" class="note">WORKLOAD</text><text x="510" y="317" class="note">p95 COMPLETE RESPONSE LATENCY (ms)</text><text x="1370" y="317" class="note">MATCHES</text><text x="60" y="375" class="body">Available products</text><rect x="510" y="350" width="680" height="36" rx="6" fill="#e9e2d6"/><rect x="510" y="350" width="589.42" height="36" rx="6" fill="#eaa30d"/><text x="1220" y="376" class="label">21.67</text><text x="1380" y="376" class="body">962</text><text x="60" y="440" class="body">Text: Rice</text><rect x="510" y="415" width="680" height="36" rx="6" fill="#e9e2d6"/><rect x="510" y="415" width="408.54" height="36" rx="6" fill="#eaa30d"/><text x="1220" y="441" class="label">15.02</text><text x="1380" y="441" class="body">40</text><text x="60" y="505" class="body">Grocery / INR 100–800</text><rect x="510" y="480" width="680" height="36" rx="6" fill="#e9e2d6"/><rect x="510" y="480" width="418.88" height="36" rx="6" fill="#eaa30d"/><text x="1220" y="506" class="label">15.40</text><text x="1380" y="506" class="body">65</text><text x="60" y="570" class="body">Nearby / 1 km</text><rect x="510" y="545" width="680" height="36" rx="6" fill="#e9e2d6"/><rect x="510" y="545" width="449.89" height="36" rx="6" fill="#eaa30d"/><text x="1220" y="571" class="label">16.54</text><text x="1380" y="571" class="body">402</text><text x="60" y="635" class="body">Fuzzy full product name</text><rect x="510" y="610" width="680" height="36" rx="6" fill="#e9e2d6"/><rect x="510" y="610" width="511.90" height="36" rx="6" fill="#eaa30d"/><text x="1220" y="636" class="label">18.82</text><text x="1380" y="636" class="body">2</text><text x="60" y="738" class="body">Measured through Caddy + gateway + authenticated domain search, including JSON parsing.</text><text x="60" y="780" class="note">Not sustained capacity, a public SLA, a real-user study or a before/after comparison. Login excluded.</text><text x="60" y="815" class="note">Source: docs/benchmarks/2026-10-05-catalogue.json · Node v24.13.1 · Docker Desktop Linux · PostgreSQL 16</text></svg>
