<div id="map" class="h-full w-full rounded-2xl bg-slate-100"></div>

<!-- Loading Spinner for Map Initialization -->
@if (loadingMap) {
  <div
    class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"
    >
    <svg
      class="h-8 w-8 animate-spin text-amber-500"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      >
      <circle
        class="opacity-25"
        cx="12"
        cy="12"
        r="10"
        stroke="currentColor"
        stroke-width="4"
      ></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
    </svg>
  </div>
}

@if (mapError) {
  <p role="status" class="ss-alert-error absolute left-4 top-4">{{ mapError }}</p>
}
