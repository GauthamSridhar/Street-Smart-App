<h2 class="mb-4 text-2xl font-bold text-ink-950">Matching shops</h2>
@for (shop of shops; track shop) {
  <button
    type="button"
    class="block w-full border-b border-slate-100 p-3 text-left transition hover:bg-amber-50"
    (click)="selectShop(shop)"
    >
    <strong class="text-ink-950">{{ shop.name }}</strong
      ><span class="block text-sm text-slate-500">{{ shop.address }}</span>
    </button>
  }
