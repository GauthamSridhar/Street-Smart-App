<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-ink-950/70" (click)="closeDialog()"></div>

  <div class="ss-dialog" role="dialog" aria-modal="true" aria-labelledby="otp-heading">
    <h2 id="otp-heading" class="mb-4 text-2xl font-bold text-ink-950">Verify your phone</h2>

    <p class="mb-4 text-sm text-slate-600">
      Please enter the 6-digit OTP sent to your
      <span class="font-semibold text-slate-700">phone number</span>.
    </p>

    <input
      type="text"
      maxlength="6"
      inputmode="numeric"
      autocomplete="one-time-code"
      aria-label="Verification code"
      class="ss-input mb-4 text-center tracking-[0.4em]"
      [(ngModel)]="otpCode"
      placeholder="Enter OTP"
      required
      />

    @if (errorMessage) {
      <p class="mb-4 text-center text-sm text-rose-600">
        {{ errorMessage }}
      </p>
    }

    <button
      type="button"
      class="ss-btn-primary mb-2 w-full"
      (click)="verifyOtp()"
      [disabled]="busy"
      >
      Submit
    </button>

    <button
      type="button"
      class="ss-btn-ghost w-full"
      (click)="closeDialog()"
      >
      Cancel
    </button>

    <div class="mt-4 text-center">
      <button
        type="button"
        class="text-sm font-semibold text-amber-600 disabled:text-slate-500"
        [disabled]="isResendDisabled"
        (click)="resendOtp()"
        >
        Resend OTP
      </button>
      @if (isResendDisabled) {
        <p class="mt-2 text-sm text-slate-500">
          You can resend OTP in {{ resendCountdown }} seconds
        </p>
      }
    </div>
  </div>
</div>
